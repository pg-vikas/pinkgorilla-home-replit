<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Bootstrap 4.5.3</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #f0abfc; /* Approximate primary color from code */
            --background: #000000;
            --text-muted: #a1a1aa;
        }
        
        body {
            background-color: var(--background);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .hero-section {
            position: relative;
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding-top: 80px;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 992px) {
            .hero-title {
                font-size: 4.5rem;
            }
        }

        .hero-description {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
        }

        /* Gradient Buttons */
        .btn-custom {
            height: 56px;
            padding: 0 32px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.125rem;
            border: none;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .btn-custom:active {
            transform: scale(0.98);
        }

        .btn-chat {
            background: linear-gradient(to right, #67e8f9, #ffffff, #6ee7b7);
            color: black;
        }

        .btn-book {
            background: linear-gradient(to right, #d946ef, #f0abfc, #8b5cf6);
            color: white;
        }

        .btn-package {
            background: linear-gradient(to right, #fcd34d, #fef08a, #fdba74);
            color: black;
        }

        .phone-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            margin-top: 2rem;
            max-width: 520px;
        }

        .phone-cta:hover {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .phone-label { color: #6ee7b7; font-weight: 900; font-size: 0.875rem; }
        .phone-number { color: #a7f3d0; font-size: 1.5rem; font-weight: 900; }
        .phone-anytime { color: rgba(209, 250, 229, 0.7); font-weight: 700; font-size: 0.875rem; }

        /* Simple placeholder for the visual orb since LiquidOrb is a React component */
        .visual-placeholder {
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .orb-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(80px);
        }

        /* Animation keyframes simulated */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .floating-element {
            animation: floating 6s ease-in-out infinite;
        }
    </style>
</head>
<body>

<section class="hero-section" id="hero">
    <div class="container">
        <div class="row align-items-center">
            <!-- Text Content -->
            <div class="col-lg-6 text-center text-lg-left mb-5 mb-lg-0">
                <h1 class="hero-title">
                    Build Your Business on Unshakable Digital Infrastructure
                </h1>
                <p class="hero-description">
                    Pink Gorilla designs, builds, and powers complete digital ecosystems for serious operators who want more than just a website.
                </p>
                
                <div class="d-flex flex-column align-items-center align-items-lg-start">
                    <div class="d-flex flex-column flex-sm-row gap-3 mb-3">
                        <button class="btn-custom btn-chat mb-2 mb-sm-0 mr-sm-2">Chat now</button>
                        <button class="btn-custom btn-book mb-2 mb-sm-0 mr-sm-2">Book a call</button>
                        <button class="btn-custom btn-package">Pick your package</button>
                    </div>

                    <a href="tel:15622846463" class="phone-cta">
                        <span class="phone-label">Call or text</span>
                        <span class="phone-number">562 284 6463</span>
                        <span class="phone-anytime">anytime</span>
                    </a>
                </div>
            </div>

            <!-- Visual Content Placeholder -->
            <div class="col-lg-6 d-none d-lg-block">
                <div class="visual-placeholder">
                    <div class="orb-glow"></div>
                    <!-- Simplified Visual representation -->
                    <div class="floating-element text-center">
                        <div class="badge badge-pill p-3 px-4 bg-dark border border-info text-white shadow-lg">
                            🚀 Websites & Systems
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
